<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda Oficial | Cazadores de Ovnis Internacional</title>
<link rel="icon" href="assets/logo.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Montserrat:wght@700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="tienda">
<div id="site-nav"></div>
<main>
  <section class="store-hero">
    <div class="container store-hero-in">
      <div class="store-head reveal">
        <span class="eyebrow"><i class="pulse-dot"></i> Intendencia y Equipamiento · División de Campo</span>
        <h1>TIENDA OFICIAL E INDUMENTARIA</h1>
        <p>Equípate con indumentaria táctica, instrumental de vigilia nocturna e insignias oficiales de Cazadores de Ovnis Internacional.</p>
      </div>
      <div class="store-toolbar reveal">
        <div class="filters store-filters" id="filters"></div>
        <div class="store-tools">
          <div class="store-search">
            <span class="ss-ic">🔍</span>
            <input type="search" id="storeSearch" placeholder="Buscar equipo o souvenir..." aria-label="Buscar producto">
          </div>
          <button class="btn btn-ghost btn-sm store-cart-btn" id="storeCartBtn" type="button">
            <span>🛒 Mi equipo</span>
            <b class="store-cart-badge" id="storeCartBadge">0</b>
          </button>
        </div>
      </div>
      <div class="store-grid" id="products"></div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
